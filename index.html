/* Minimalista en blanco y negro: tipografía fina, líneas de 1px, sin sombras */
:root{
  --bg:#fafafa; --ink:#141414; --muted:#8a8a8a; --line:#e2e2e2; --soft:#f0f0f0;
  --display:"Cormorant Garamond", Georgia, serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;font-size:15px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,label:focus-within{outline:1px solid var(--ink);outline-offset:4px}
.label{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;font-weight:400}
.serif{font-family:var(--display);font-weight:400}

  padding:calc(28px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(36px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));
  animation:fadeIn 1.6s ease .4s both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.landing-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.landing-bottom{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.landing h1{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,7vw,4.6rem);line-height:1;margin:0;letter-spacing:-.01em}
.landing h1 em{font-style:italic}
#loginForm{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--ink);width:min(320px,100%)}
#pw{flex:1;min-width:0;font:inherit;font-weight:400;letter-spacing:.3em;background:transparent;border:0;padding:12px 4px;color:var(--ink);text-align:center}
#pw::placeholder{letter-spacing:.24em;font-size:.72rem;text-transform:uppercase;color:#555}
#pw:focus{outline:none}
#loginForm button{padding:12px 6px;font-size:1.2rem}
.error{min-height:1.2em;font-size:.82rem;color:#7a1f1f}
.hint{font-size:.72rem;color:#555}

/* ---------- App ---------- */
.app{min-height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:1.35rem;font-style:italic}
.nav{display:flex;gap:18px}
.nav button{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-weight:400;color:var(--muted);padding:6px 0;border-bottom:1px solid transparent;font-variant-numeric:tabular-nums}
.nav button:hover,.nav button[aria-current=true]{color:var(--ink);border-bottom-color:var(--ink)}

/* Cargar */
.load{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:40px}
.load h2{font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1.05;margin:0}
.load p{margin:0;color:var(--muted);line-height:1.6;max-width:36ch}
.pick{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.pick label,.pick button{display:flex;justify-content:space-between;align-items:center;padding:18px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:400;text-align:left;width:100%}
.pick label:hover,.pick button:hover{padding-left:8px;transition:padding .2s}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick small{color:var(--muted);font-weight:300}
code{font-size:.78rem;background:var(--soft);padding:2px 6px}

/* Revisar */
.review{flex:1;display:flex;flex-direction:column;gap:18px;padding-top:18px}
.meta{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.meta .count{font-family:var(--display);font-size:1.5rem}
.meta .name{font-size:.75rem;color:var(--muted);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:1px;background:var(--line);position:relative}
.track i{position:absolute;left:0;top:0;height:1px;background:var(--ink);width:0;transition:width .3s}
.deck{position:relative;flex:1;min-height:360px;max-height:640px}
.card{position:absolute;inset:0;background:var(--soft);touch-action:none;user-select:none;will-change:transform,opacity;overflow:hidden}
.card img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.card.back{opacity:0}
.tag{position:absolute;top:16px;padding:6px 12px;background:rgba(255,255,255,.9);font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;font-weight:400;opacity:0}
.tag.keep{right:16px} .tag.toss{left:16px}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-top:4px}
.controls button{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;font-weight:400;padding:16px 0;border:1px solid var(--line);transition:background .2s,color .2s,border-color .2s}
.controls .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.controls .k:hover{opacity:.85}
.controls .t:hover{border-color:var(--ink)}
.controls .u{border:0;width:44px;height:44px;padding:0;display:grid;place-items:center;color:var(--muted)}
.controls .u:disabled{opacity:.3;cursor:default}
.controls .u svg{width:18px;height:18px}
.help{text-align:center;font-size:.72rem;color:var(--muted);margin:0}

/* Colección */
.collection{flex:1;display:flex;flex-direction:column;gap:20px;padding-top:24px}
.collection h2{font-family:var(--display);font-weight:400;font-size:2.2rem;margin:0;line-height:1}
.collection .sub{color:var(--muted);margin:-10px 0 0;font-size:.85rem;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.thumb{position:relative;aspect-ratio:1;background:var(--soft);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(0);transition:transform .4s}
.thumb:hover img{transform:scale(1.04)}
.thumb button{position:absolute;inset:auto 0 0 0;padding:8px;background:rgba(255,255,255,.92);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;opacity:0;transition:opacity .2s}
.thumb:hover button,.thumb:focus-within button{opacity:1}
@media (hover:none){.thumb button{opacity:1}}
.empty{grid-column:1/-1;padding:48px 0;text-align:center;color:var(--muted);font-family:var(--display);font-style:italic;font-size:1.2rem}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:16px}
.btn{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;font-weight:400;padding:16px;border:1px solid var(--ink);text-align:center}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.3;cursor:default}
.note{text-align:center;font-size:.78rem;color:var(--muted);min-height:1.2em;margin:0}

.card img{opacity:0;transition:opacity .3s}.card img.ready{opacity:1}
.card .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase}
.thumb img{opacity:0}.thumb img.ready{opacity:1;transition:opacity .3s}
#loginForm.busy{opacity:.5;pointer-events:none}
@media (prefers-reduced-motion:reduce){.hero{animation:none}.landing-inner{animation:none}.card,.track i{transition:none!important}}
</style>
</head>
<body>

<!-- Landing con contraseña -->
<section id="landing" class="landing">
  <div class="hero" role="img" aria-label="Victor y Nadya frente a la pirámide del Louvre"></div>
  <div class="veil"></div>
  <div class="landing-inner">
    <div class="landing-top">
      <span class="label">V &amp; N</span>
      <span class="label">París</span>
    </div>
    <div class="landing-bottom">
      <h1>Nuestra <em>boda</em></h1>
      <form id="loginForm" autocomplete="off">
        <input id="pw" type="password" placeholder="Contraseña" aria-label="Contraseña" required>
        <button type="submit" aria-label="Entrar">→</button>
      </form>
      <div id="pwErr" class="error" role="alert"></div>
      <p class="hint" id="hint"></p>
    </div>
  </div>
</section>

<!-- App -->
<div id="app" class="app" hidden>
  <header class="header">
    <button class="brand" id="homeBtn" type="button">V &amp; N</button>
    <nav class="nav" id="nav" hidden>
      <button id="navReview" type="button">Revisar</button>
      <button id="navKeep" type="button">Elegidas <span id="kCount">0</span></button>
      <button id="navTrash" type="button">Papelera <span id="tCount">0</span></button>
    </nav>
  </header>

  <!-- Estado de carga / error -->
  <section id="load" class="load">
    <span class="label" style="color:var(--muted)" id="loadLabel">Un momento</span>
    <h2 id="loadTitle">Abriendo<br>las fotos</h2>
    <p id="loadMsg">Descifrando la lista de fotos.</p>
  </section>

  <!-- Revisar -->
  <section id="review" class="review" hidden>
    <div class="meta"><span class="count" id="counter">1 / 1</span><span class="name" id="fname"></span></div>
    <div class="track"><i id="bar"></i></div>
    <div class="deck" id="deck"></div>
    <div class="controls">
      <button class="t" id="tossBtn" type="button">← Descartar</button>
      <button class="u" id="undoBtn" type="button" aria-label="Deshacer" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="k" id="keepBtn" type="button">Conservar →</button>
    </div>
    <p class="help">Desliza la foto o usa las flechas ← → · Z deshace</p>
  </section>

  <!-- Colección -->
  <section id="collection" class="collection" hidden>
    <h2 id="colTitle">Elegidas</h2>
    <p class="sub" id="colSub"></p>
    <div class="grid" id="grid"></div>
    <div class="foot">
      <button class="btn solid" id="dlBtn" type="button">Descargar elegidas · ZIP</button>
      <button class="btn" id="backBtn" type="button">Seguir revisando</button>
      <p class="note" id="dlNote"></p>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const DATA = "datos/";
  const ZIP_PART = 400e6;          // tamaño máximo de cada ZIP (bytes)
  const STORE = "boda-estado-v1";  // elecciones guardadas en este navegador
  let key = null, demo = false;
  let photos = [], idx = 0, history = [], view = "load", colTab = "keep";

  // ---------- Cifrado ----------
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function deriveKey(pw, cfg){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(cfg.salt), iterations:cfg.iterations, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  }
  async function decrypt(buf){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, key, buf.slice(12));
  }
  async function fetchDecrypt(path, type){
    const r = await fetch(DATA + path);
    if (!r.ok) throw new Error("No se encontró " + path);
    const plain = await decrypt(await r.arrayBuffer());
    return new Blob([plain], {type});
  }

  // ---------- Entrada ----------
  let config = null;
  const configReady = fetch(DATA + "config.json", {cache:"no-store"})
    .then(r => r.ok ? r.json() : null).catch(() => null)
    .then(c => { config = c; if (!c) { demo = true; $("hint").textContent = "Modo demostración · contraseña: boda2026"; } return c; });

  if (!window.crypto?.subtle){
    $("pwErr").textContent = "Abre el sitio desde su dirección https:// para poder descifrar las fotos.";
  }

  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = $("pw").value, form = $("loginForm");
    $("pwErr").textContent = "";
    form.classList.add("busy");
    try{
      await configReady;
      if (demo){
        if (pw !== "boda2026") throw new Error("pw");
        photos = await makeDemo();
      } else {
        key = await deriveKey(pw, config);
        const r = await fetch(DATA + "manifest.bin", {cache:"no-store"});
        let list;
        try { list = JSON.parse(new TextDecoder().decode(await decrypt(await r.arrayBuffer()))); }
        catch(_) { throw new Error("pw"); }
        photos = list.map(m => ({...m, state:null}));
      }
      restore();
      enter();
    }catch(err){
      key = null;
      $("pwErr").textContent = err.message === "pw" ? "Contraseña incorrecta" : "No se pudieron abrir las fotos. Revisa tu conexión.";
      $("pw").select();
    }finally{ form.classList.remove("busy"); }
  });

  function enter(){
    const l = $("landing");
    l.style.transition = "opacity .6s"; l.style.opacity = 0;
    setTimeout(() => { l.hidden = true; $("app").hidden = false; }, 600);
    const first = photos.findIndex(p => !p.state);
    idx = first === -1 ? photos.length : first;
    go(idx >= photos.length ? (colTab = "keep", "collection") : "review");
  }

  // ---------- Elecciones guardadas en el navegador ----------
  function saveState(){
    try{
      const m = {}; photos.forEach(p => { if (p.state) m[p.id] = p.state; });
      localStorage.setItem(STORE + (demo ? "-demo" : ""), JSON.stringify(m));
    }catch(_){}
  }
  function restore(){
    try{
      const m = JSON.parse(localStorage.getItem(STORE + (demo ? "-demo" : "")) || "{}");
      photos.forEach(p => { p.state = m[p.id] || null; });
    }catch(_){}
  }

  // ---------- Imágenes (con caché) ----------
  const previews = new Map(), thumbs = new Map();
  function getPreview(p){
    if (!previews.has(p.id)){
      const prom = demo ? Promise.resolve(URL.createObjectURL(p.blob))
                        : fetchDecrypt(`p/${p.id}.bin`, "image/jpeg").then(b => URL.createObjectURL(b));
      previews.set(p.id, prom);
      if (previews.size > 12){                      // libera memoria de las más viejas
        const [oldId, oldProm] = previews.entries().next().value;
        previews.delete(oldId); oldProm.then(u => URL.revokeObjectURL(u)).catch(()=>{});
      }
    }
    return previews.get(p.id);
  }
  function getThumb(p){
    if (!thumbs.has(p.id)){
      thumbs.set(p.id, demo ? Promise.resolve(URL.createObjectURL(p.blob))
                            : fetchDecrypt(`t/${p.id}.bin`, "image/jpeg").then(b => URL.createObjectURL(b)));
    }
    return thumbs.get(p.id);
  }
  const getOriginal = p => demo ? Promise.resolve(p.blob) : fetchDecrypt(`o/${p.id}.bin`, p.type);

  // ---------- Vistas ----------
  function go(v){
    view = v;
    ["load","review","collection"].forEach(s => $(s).hidden = s !== v);
    $("nav").hidden = !photos.length;
    $("navReview").setAttribute("aria-current", v==="review");
    $("navKeep").setAttribute("aria-current", v==="collection" && colTab==="keep");
    $("navTrash").setAttribute("aria-current", v==="collection" && colTab==="trash");
    if (v==="review") render();
    if (v==="collection") drawCollection();
  }
  $("navReview").onclick = () => { if (idx >= photos.length){ const f = photos.findIndex(p=>!p.state); idx = f === -1 ? photos.length : f; } go("review"); };
  $("navKeep").onclick = () => { colTab="keep"; go("collection"); };
  $("navTrash").onclick = () => { colTab="trash"; go("collection"); };
  $("homeBtn").onclick = () => $("navReview").onclick();

  // ---------- Revisar ----------
  const deck = $("deck");
  function counts(){
    $("kCount").textContent = photos.filter(p=>p.state==="keep").length;
    $("tCount").textContent = photos.filter(p=>p.state==="trash").length;
  }
  function render(){
    counts();
    const n = photos.length;
    deck.innerHTML = "";
    $("undoBtn").disabled = !history.length;
    $("bar").style.width = (photos.filter(p=>p.state).length / n * 100) + "%";
    if (idx >= n){ colTab = "keep"; go("collection"); return; }
    $("counter").textContent = `${idx+1} / ${n}`;
    $("fname").textContent = photos[idx].name;
    if (photos[idx+1]) deck.appendChild(card(photos[idx+1], true));
    const c = card(photos[idx], false); deck.appendChild(c); drag(c);
    [1,2,3].forEach(k => photos[idx+k] && getPreview(photos[idx+k]));   // precarga
  }
  function card(p, back){
    const el = document.createElement("div");
    el.className = "card" + (back ? " back" : "");
    el.innerHTML = `<span class="wait">Cargando</span><img alt=""><span class="tag toss">Descartar</span><span class="tag keep">Conservar</span>`;
    const img = el.querySelector("img"), wait = el.querySelector(".wait");
    getPreview(p).then(u => { img.onload = () => { img.classList.add("ready"); wait.remove(); }; img.src = u; })
                 .catch(() => { wait.textContent = "No se pudo cargar"; });
    return el;
  }
  function drag(c){
    let x0=0, dx=0, on=false;
    const tk = c.querySelector(".tag.keep"), tt = c.querySelector(".tag.toss");
    c.addEventListener("pointerdown", e => { on=true; x0=e.clientX; c.setPointerCapture(e.pointerId); c.style.transition="none"; });
    c.addEventListener("pointermove", e => {
      if(!on) return; dx = e.clientX - x0;
      c.style.transform = `translateX(${dx}px) rotate(${dx/40}deg)`;
      c.style.opacity = 1 - Math.min(Math.abs(dx)/600, .4);
      tk.style.opacity = Math.max(0, Math.min(1, dx/90));
      tt.style.opacity = Math.max(0, Math.min(1, -dx/90));
    });
    const end = () => {
      if(!on) return; on=false;
      if (dx > 90) decide("keep"); else if (dx < -90) decide("trash");
      else { c.style.transition="transform .3s, opacity .3s"; c.style.transform=""; c.style.opacity=1; tk.style.opacity=tt.style.opacity=0; }
      dx=0;
    };
    c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
  }
  let busy = false;
  function decide(state){
    if (busy || view!=="review" || idx >= photos.length) return;
    busy = true;
    const c = deck.lastElementChild, dir = state==="keep" ? 1 : -1;
    if (c){
      c.style.transition = "transform .35s ease-in, opacity .35s";
      c.style.transform = `translateX(${dir*60}%)`; c.style.opacity = 0;
      const nxt = c.previousElementSibling;
      if (nxt){ nxt.style.transition="opacity .35s"; nxt.style.opacity=1; }
    }
    photos[idx].state = state; history.push(idx); saveState();
    const nextFree = photos.findIndex((p,i) => i > idx && !p.state);
    idx = nextFree === -1 ? photos.length : nextFree;
    setTimeout(() => { busy = false; render(); }, 300);
  }
  function undo(){
    if (!history.length) return;
    idx = history.pop(); photos[idx].state = null; saveState(); go("review");
  }
  $("keepBtn").onclick = () => decide("keep");
  $("tossBtn").onclick = () => decide("trash");
  $("undoBtn").onclick = undo;
  addEventListener("keydown", e => {
    if (view!=="review" || $("app").hidden) return;
    if (e.key==="ArrowRight") decide("keep");
    else if (e.key==="ArrowLeft") decide("trash");
    else if (e.key.toLowerCase()==="z") undo();
  });

  // ---------- Colección ----------
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    io.unobserve(en.target);
    const img = en.target.querySelector("img"), p = photos.find(x => x.id === en.target.dataset.id);
    getThumb(p).then(u => { img.onload = () => img.classList.add("ready"); img.src = u; }).catch(()=>{});
  }), {rootMargin:"300px"});

  function drawCollection(){
    counts();
    const keep = colTab==="keep";
    const list = photos.filter(p => p.state === colTab);
    const pending = photos.filter(p => !p.state).length;
    $("colTitle").textContent = keep ? "Elegidas" : "Papelera";
    $("colSub").textContent = `${list.length} ${list.length===1?"foto":"fotos"}` + (pending ? ` · faltan ${pending} por revisar` : " · revisión completa");
    $("dlBtn").hidden = !keep; $("dlBtn").disabled = !list.length;
    const mb = list.reduce((s,p) => s + (p.size||0), 0) / 1e6;
    $("dlBtn").textContent = list.length ? `Descargar elegidas · ZIP · ${mb >= 1000 ? (mb/1000).toFixed(1)+" GB" : Math.round(mb)+" MB"}` : "Descargar elegidas · ZIP";
    $("backBtn").textContent = pending ? "Seguir revisando" : "Revisar todo otra vez";
    $("backBtn").onclick = pending ? () => $("navReview").onclick()
      : () => { photos.forEach(p=>p.state=null); history=[]; idx=0; saveState(); go("review"); };
    if (!dlRunning) $("dlNote").textContent = "";
    const g = $("grid"); g.innerHTML = "";
    if (!list.length){ g.innerHTML = `<p class="empty">${keep ? "Aún no hay fotos elegidas" : "La papelera está vacía"}</p>`; return; }
    list.forEach(p => {
      const d = document.createElement("div"); d.className = "thumb"; d.dataset.id = p.id;
      d.innerHTML = `<img alt=""><button type="button">${keep ? "Mover a papelera" : "Recuperar"}</button>`;
      d.querySelector("button").onclick = () => { p.state = keep ? "trash" : "keep"; saveState(); drawCollection(); };
      g.appendChild(d); io.observe(d);
    });
  }

  // ---------- Descarga (originales, en partes de ~400 MB) ----------
  let dlRunning = false;
  $("dlBtn").onclick = async () => {
    if (dlRunning) return;
    const sel = photos.filter(p=>p.state==="keep"), note = $("dlNote");
    if (!window.JSZip){ note.textContent = "Necesitas conexión a internet para crear el ZIP."; return; }
    const parts = []; let cur = [], size = 0;
    sel.forEach(p => { if (cur.length && size + p.size > ZIP_PART){ parts.push(cur); cur = []; size = 0; } cur.push(p); size += p.size; });
    if (cur.length) parts.push(cur);
    dlRunning = true; $("dlBtn").disabled = true;
    try{
      let done = 0;
      for (let k = 0; k < parts.length; k++){
        const zip = new JSZip(), f = zip.folder("boda-elegidas"), used = new Set();
        for (const p of parts[k]){
          note.textContent = `Descifrando ${++done} de ${sel.length}` + (parts.length > 1 ? ` · parte ${k+1} de ${parts.length}` : "");
          let name = p.name; while (used.has(name)) name = "_" + name; used.add(name);
          f.file(name, await getOriginal(p));
        }
        const blob = await zip.generateAsync({type:"blob", compression:"STORE"},
          m => note.textContent = `Preparando ZIP ${Math.round(m.percent)}%` + (parts.length > 1 ? ` · parte ${k+1} de ${parts.length}` : ""));
        const fname = parts.length > 1 ? `boda-elegidas-${k+1}-de-${parts.length}.zip` : "boda-elegidas.zip";
        const a = document.createElement("a"), url = URL.createObjectURL(blob);
        a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }
      note.textContent = parts.length > 1 ? `${sel.length} fotos en ${parts.length} archivos ZIP` : `${sel.length} fotos en boda-elegidas.zip`;
    }catch(_){
      note.textContent = "Se interrumpió la descarga. Revisa tu conexión e intenta de nuevo.";
    }finally{ dlRunning = false; $("dlBtn").disabled = false; }
  };

  // ---------- Modo demostración (cuando aún no hay carpeta datos/) ----------
  async function makeDemo(){
    const scenes = ["Ceremonia","Anillos","Primer baile","Brindis","Pastel","Familia","Retrato","Salida"];
    const list = [];
    for (let i=0;i<scenes.length;i++){
      const c = document.createElement("canvas"); c.width=900; c.height=1200;
      const g = c.getContext("2d"), l = 30 + i*7;
      const gr = g.createLinearGradient(0,0,900,1200);
      gr.addColorStop(0,`hsl(0 0% ${l+35}%)`); gr.addColorStop(1,`hsl(0 0% ${l}%)`);
      g.fillStyle = gr; g.fillRect(0,0,900,1200);
      g.strokeStyle="rgba(255,255,255,.25)"; g.lineWidth=2;
      for(let k=-1200;k<900;k+=90){g.beginPath();g.moveTo(k,0);g.lineTo(k+1200,1200);g.stroke();g.beginPath();g.moveTo(k+1200,0);g.lineTo(k,1200);g.stroke();}
      g.fillStyle="#fff"; g.textAlign="center";
      g.font="italic 400 96px Georgia, serif"; g.fillText(scenes[i],450,610);
      g.font="300 28px sans-serif"; g.fillText("FOTO DE EJEMPLO "+(i+1),450,670);
      const blob = await new Promise(r => c.toBlob(r,"image/jpeg",.85));
      list.push({id:String(i+1).padStart(4,"0"), name:`ejemplo-${i+1}-${scenes[i].toLowerCase().replace(/ /g,"-")}.jpg`, type:"image/jpeg", size:blob.size, blob, state:null});
    }
    return list;
  }
})();
